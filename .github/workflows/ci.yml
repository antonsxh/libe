name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    # Used only by the Nix job's push step, which runs on pushes to main only.
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # Builds and smoke-tests the image on both architectures; nothing is pushed.
  docker:
    name: Docker
    uses: ./.github/workflows/docker.yml
