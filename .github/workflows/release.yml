name: Release

# Three channels, modelled on pingdotgg/t3code (docs/RELEASING.md has the full runbook):
#
#   nightly  automatic gate check after every green CI run on main and on the schedule (twice an
#            hour, the catch-up). GitHub delivers scheduled runs best effort (many are delayed or
#            dropped, new schedules may get none), so the schedule alone is not enough. Publishes
#            when main moved since the last nightly and that one is at least 6 h old. GitHub
#            prerelease + image tags `<version>` and `nightly`.
#   preview  manual (`channel=preview`, any branch): the whole pipeline for a commit nobody
#            should install. Draft release, image tag `<version>` only.
#   stable   manual (`channel=stable` on main): promotes the commit of the latest nightly, version
#            defaults to the one it previewed. Or push a `vX.Y.Z` tag to release that commit.
#            Latest release + image tags `X.Y.Z`, `X.Y`, `X`, `stable`, `latest`; then bumps
#            the version files on main.
#
# NixOS: after a nightly or plain stable release, `nix` builds the flake's desktop package on
# x86_64 and aarch64 and pushes it to libe.cachix.org; only then `nix-channel` moves the branch
# `channel/nightly` or `channel/stable` (and tags `nix-v<version>`). Previews and -rc never.
#
# Nothing is published unless every check, the desktop builds and the image smoke tests pass.
# The checks run here only when no passed run exists for the commit: nightlies and tags reuse
# ci.yml's run of the same commit, stable-by-dispatch the nightly it promotes (`verified`,
# see checksDecision in scripts/release.ts). An automatic nightly waits for CI and skips red
# commits.

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-nightly.*'
      - '!v*-preview.*'
  # Nightly gate check as soon as CI passed on main (the push run; PR runs have other branches).
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    # Catch-up gate check for a main that moved while the last nightly was younger than 6 h.
    # Avoids minute 0 (GitHub's busiest). Best effort: GitHub delays or drops scheduled runs.
    - cron: '8,38 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        default: preview
        options: [preview, stable, nightly]
      version:
        description: 'Stable only: version override, e.g. 0.2.0 (default: the version the latest nightly previewed)'
        type: string
        required: false

# Nightlies and previews queue behind each other so two runs never build the same version or
# publish out of order; stable (tag push or dispatch) has its own group so a nightly never
# blocks it. Running publishers are never cancelled, and `queue: max` keeps every pending run
# (the default keeps one and cancels the older), so a queued preview or tag is never dropped.
# Queued automatic checks are harmless: the gate is evaluated once the run starts.
concurrency:
  group: release-${{ (github.event_name == 'push' || inputs.channel == 'stable') && 'stable' || 'prerelease' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  plan:
    name: Plan release
    # Forks never release; PAUSE_NIGHTLY=true (repository variable) pauses the automatic nightly
    # checks only (see isAutomaticNightly). A red or cancelled CI run starts no plan.
    if: >-
      !github.event.repository.fork &&
      ((github.event_name != 'schedule' && github.event_name != 'workflow_run') ||
       vars.PAUSE_NIGHTLY != 'true') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # ci.yml runs of the commit
    outputs:
      release: ${{ steps.plan.outputs.release }}
      verified: ${{ steps.plan.outputs.verified }}
      channel: ${{ steps.plan.outputs.channel }}
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      name: ${{ steps.plan.outputs.name }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      latest: ${{ steps.plan.outputs.latest }}
      docker_tags: ${{ steps.plan.outputs.docker_tags }}
      nix_track: ${{ steps.plan.outputs.nix_track }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - id: plan
        run: bun scripts/release.ts plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMAGE: ghcr.io/${{ github.repository }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}

      - name: Summary
        if: steps.plan.outputs.release == 'true'
        run: |
          {
            echo "### ${{ steps.plan.outputs.name }}"
            echo "- channel: \`${{ steps.plan.outputs.channel }}\`"
            echo "- commit: \`${{ steps.plan.outputs.ref }}\`"
            echo "- checks: ${{ steps.plan.outputs.verified == 'true' && 'already passed (skipped here)' || 'run here' }}"
            echo "- notes since: \`${{ steps.plan.outputs.previous_tag || '(first release)' }}\`"
            echo "- image tags: \`${{ steps.plan.outputs.docker_tags }}\`"
            echo "- NixOS channel: \`${{ steps.plan.outputs.nix_track && format('channel/{0}', steps.plan.outputs.nix_track) || '(none)' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Checks
    needs: plan
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.verified != 'true'
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}

  desktop:
    name: Desktop
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}
      version: ${{ needs.plan.outputs.version }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # Builds, smoke-tests and pushes each architecture untagged (by digest).
  docker:
    name: Docker
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}
      version: ${{ needs.plan.outputs.version }}
      push: true

  # Only after every check passed: one multi-arch manifest carrying the channel's tags.
  # A skipped `checks` job counts only when plan verified the commit. The explicit `if`s here
  # and below are needed because a skipped job skips everything after it by default.
  image:
    name: Tag image
    needs: [plan, checks, desktop, docker]
    if: >-
      !cancelled() && needs.desktop.result == 'success' && needs.docker.result == 'success' &&
      (needs.checks.result == 'success' ||
       (needs.checks.result == 'skipped' && needs.plan.outputs.verified == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ needs.plan.outputs.docker_tags }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          test "$(ls | wc -l)" -eq 2
          args=()
          for tag in ${TAGS//,/ }; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.version=${{ needs.plan.outputs.version }}" \
            --annotation "index:org.opencontainers.image.description=Personal quest/time planner (server)" \
            $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "${TAGS%%,*}"

  release:
    name: Publish GitHub release
    needs: [plan, image]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
      NIX_TRACK: ${{ needs.plan.outputs.nix_track }}
    steps:
      # The release scripts of this workflow run (not of the released commit).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      # Tauri update manifest pointing at this release's signed installers.
      - name: Update manifest
        run: bun scripts/release.ts updater-manifest dist

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release notes
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$CHANNEL" = preview ]; then
            cat > notes.md <<EOF
          > [!WARNING]
          > **Preview build — do not install.** Previews exercise the release pipeline for a commit
          > that may never ship (often an unmerged branch). They get no fixes and no image channel tag.
          > Use the [latest release]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest) or a nightly instead.

          Built from \`$REF\`. Image: \`$image:$VERSION\`
          EOF
          else
            channel_tag=$([ "$CHANNEL" = nightly ] && echo nightly || echo stable)
            cat > notes.md <<EOF
          ### Server (Docker)

          \`\`\`sh
          docker pull $image:$VERSION   # or :$channel_tag
          \`\`\`

          In \`compose.yaml\` set \`LIBE_IMAGE=$image:$channel_tag\` (see the README).

          ### Desktop app

          Unsigned installers below (\`.dmg\` macOS, \`-setup.exe\` Windows, \`.deb\`/\`.AppImage\` Linux),
          checksums in \`SHA256SUMS\`. macOS: right-click → Open the first time. Installed apps
          update themselves (Settings → Desktop app → Update track: Stable or Nightly).

          EOF
          fi
          if [ -n "$NIX_TRACK" ]; then
            cat >> notes.md <<EOF
          ### NixOS

          \`nix run github:$GITHUB_REPOSITORY/channel/$NIX_TRACK\`, or the flake input
          \`github:$GITHUB_REPOSITORY/channel/$NIX_TRACK\` ([docs/NIXOS.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/NIXOS.md)).
          The channel moves to this release once it is in the binary cache (\`libe.cachix.org\`).

          EOF
          fi
          cat notes.md

      - name: Publish
        run: |
          args=(--target "$REF" --title "${{ needs.plan.outputs.name }}" --notes-file notes.md)
          if [ "$CHANNEL" = preview ]; then
            # Stays a draft: a draft creates no git tag, so previews never show up as releases.
            args+=(--draft --prerelease --latest=false)
          else
            args+=(--generate-notes)
            [ -n "$PREVIOUS_TAG" ] && args+=(--notes-start-tag "$PREVIOUS_TAG")
            if [ "${{ needs.plan.outputs.prerelease }}" = true ]; then
              args+=(--prerelease --latest=false)
            else
              args+=(--latest)
            fi
          fi
          # gh uploads the assets to a draft first and publishes it once all are attached.
          gh release create "$TAG" dist/* "${args[@]}"
          gh release view "$TAG" --json url,isDraft,isPrerelease --jq '.'

      # Desktop apps on this track update from `update-feed/<track>.json` (src-tauri/src/updates.rs).
      # Previews and stable prereleases (vX.Y.Z-rc.N) are never offered.
      - name: Update feed
        if: needs.plan.outputs.channel == 'nightly' || needs.plan.outputs.latest == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! gh release view update-feed > /dev/null 2>&1; then
            gh release create update-feed --target "$DEFAULT_BRANCH" --prerelease --latest=false \
              --title 'Desktop update feed' \
              --notes 'Update manifests of the libe desktop app (stable.json, nightly.json), replaced by every release. Nothing to download here.'
          fi
          cp dist/latest.json "$CHANNEL.json"
          gh release upload update-feed "$CHANNEL.json" --clobber

  # NixOS (docs/NIXOS.md): build the commit users will fetch — the released commit plus its
  # version files and nix/release.json (`release.ts nix-commit`, deterministic, so every job
  # recreates the same commit) — natively on both architectures and push it to the binary
  # cache. Paths already on cache.nixos.org are not pushed (Cachix checks its upstream).
  # A failure leaves the channel on the previous release; the GitHub release stays.
  nix:
    name: Nix ${{ matrix.system }}
    needs: [plan, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.plan.outputs.nix_track != '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
      NIX_TRACK: ${{ needs.plan.outputs.nix_track }}
    steps:
      # The release scripts of this workflow run; the released commit next to them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          path: release
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: tools/package.json

      - id: commit
        working-directory: release
        run: bun ../tools/scripts/release.ts nix-commit

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        if: steps.commit.outputs.commit != ''

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: steps.commit.outputs.commit != ''
        with:
          name: libe
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true # only the package below, not every build-time path

      - name: Build
        if: steps.commit.outputs.commit != ''
        working-directory: release
        run: |
          nix build .#packages.${{ matrix.system }}.desktop -L
          test -x result/bin/libe
          test -f result/share/applications/libe.desktop
          # the version Settings shows is compiled into the binary
          grep -aqF "$VERSION" result/bin/.libe-wrapped
          nix path-info -Sh ./result # closure size

      - name: Push to Cachix
        if: steps.commit.outputs.commit != ''
        working-directory: release
        run: cachix push libe "$(readlink result)"
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # Only after both architectures are in the cache: `channel/<track>` and the tag
  # `nix-v<version>` → the release's Nix commit (never backwards, see `nixChannelMove`).
  nix-channel:
    name: Move NixOS channel
    needs: [plan, nix]
    if: ${{ !cancelled() && needs.nix.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
      NIX_TRACK: ${{ needs.plan.outputs.nix_track }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false

      # Keeps the token: nix-publish pushes from here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          path: release
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: tools/package.json

      - id: commit
        working-directory: release
        run: bun ../tools/scripts/release.ts nix-commit

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        if: steps.commit.outputs.commit != ''

      # What users of this commit will substitute: both packages must be on libe.cachix.org.
      - name: Check the binary cache
        if: steps.commit.outputs.commit != ''
        working-directory: release
        run: |
          for system in x86_64-linux aarch64-linux; do
            out="$(nix eval --raw ".#packages.$system.desktop.outPath")"
            nix path-info --store https://libe.cachix.org "$out"
          done

      - id: publish
        if: steps.commit.outputs.commit != ''
        working-directory: release
        run: bun ../tools/scripts/release.ts nix-publish

      - name: Release notes
        if: steps.publish.outputs.moved == 'true'
        run: |
          pin="Pinned to this release: \`github:$GITHUB_REPOSITORY/nix-$TAG\`"
          gh release view "$TAG" --json body --jq .body > notes.md
          grep -qF "$pin" notes.md && exit 0 # a re-run
          printf '\n%s\n' "$pin" >> notes.md
          gh release edit "$TAG" --notes-file notes.md

  # Stable only: the version files on main now name the released version, so the next
  # nightlies preview the patch after it.
  finalize:
    name: Bump version on main
    needs: [plan, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.plan.outputs.channel == 'stable' && needs.plan.outputs.latest == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Commit and push
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          current="$(jq -r .version package.json)"
          if [ "$(bun -e "import {compareVersions} from './scripts/release.ts'; console.log(compareVersions('$VERSION', '$current') > 0)")" != true ]; then
            echo "main already at $current (>= $VERSION)."
            exit 0
          fi
          bun scripts/release.ts set-version "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): v$VERSION"
          for attempt in 1 2 3 4 5; do
            git push origin "HEAD:$BRANCH" && exit 0
            echo "Push rejected (attempt $attempt), rebasing onto $BRANCH."
            git pull --rebase origin "$BRANCH"
          done
          exit 1
