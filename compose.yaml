name: libe

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: libe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libe}
      POSTGRES_DB: libe
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U libe -d libe']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://libe:${POSTGRES_PASSWORD:-libe}@db:5432/libe
      # Pairs the first device on /setup (and recovers access if every device is lost).
      LIBE_SETUP_SECRET: ${LIBE_SETUP_SECRET:?LIBE_SETUP_SECRET is required - put a long random value into .env, e.g. `openssl rand -base64 24`}
      # The URL the app is reached under, e.g. https://libe.example.com. SvelteKit uses it for
      # the CSRF check of form posts, pairing QR links and the `Secure` flag of the device
      # cookie. Behind a TLS proxy it MUST be the public https URL (see compose.caddy.yaml).
      ORIGIN: ${LIBE_ORIGIN:-http://localhost:3000}
      # "Today" is computed in this timezone on the server
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - '${LIBE_PORT:-3000}:3000'

volumes:
  pgdata:
