[package]
name = "libe"
version = "0.1.1-nightly.20261121.31"
description = "libe desktop app — a thin client for a self-hosted libe server"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows (Tauri template convention).
name = "libe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tauri-plugin-updater = "2"
semver = "1"
tokio = { version = "1", features = ["time"] }

# The device token lives in the OS credential store: macOS Keychain, Windows Credential
# Manager, Secret Service (GNOME Keyring / KWallet) on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
